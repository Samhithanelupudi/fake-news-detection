<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XML Data Table & Chart</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        #chartContainer {
            width: 300px;
            height: 200px;
        }
    </style>
</head>

<body>
    <input type="file" id="xmlFile" accept=".xml">
    <table border="1" id="dataTable"></table>
    <div id="chartContainer"><canvas id="dataChart"></canvas></div>

    <script>
        document.getElementById('xmlFile').addEventListener('change', e => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = event => {
                            const xmlDoc = new DOMParser().parseFromString(event.target.result, "text/xml");
                            const records = [...xmlDoc.getElementsByTagName("record")];
                            if (!records.length) return;
                            let headers = [...records[0].children].map(el => el.tagName);
                            let data = records.map(rec => [...rec.children].map(cell => cell.textContent));
                            document.getElementById("dataTable").innerHTML =
                                `<tr>${headers.map(h => `<th>${h}</th>`).join('')}</tr>` +
data.map(row => `<tr>${row.map(d => `<td>${d}</td>`).join('')}</tr>`).join('');
new Chart(document.getElementById("dataChart"), {
type: "bar",
data: { labels: data.map(row => row[0]), datasets: [{ data: data.map(row => +row[1] || 0), backgroundColor: "blue" }] },
options: { responsive: false, maintainAspectRatio: false }
});
};
reader.readAsText(file);
});
    </script>
</body>

</html>
