<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Multiple Bar Chart</title>
    <script src="https://cdn.canvasjs.com/canvasjs.min.js"></script>
</head>

<body>
    <div id="chartContainer" style="height: 300px; width: 400px;"></div>
    <script>
        window.onload = function() {
            const chart = new CanvasJS.Chart("chartContainer", {
                title: {
                    text: "Multiple Bar Chart"
                },
                axisY: {
                    title: "Values"
                },
                data: [{
                    type: "bar",
                    name: "Category 1",
                    showInLegend: true,
                    dataPoints: [{
                        label: "A",
                        y: 30
                    }, {
                        label: "B",
                        y: 50
                    }]
                }, {
                    type: "bar",
                    name: "Category 2",
                    showInLegend: true,
                    dataPoints: [{
                        label: "A",
                        y: 20
                    }, {
                        label: "B",
                        y: 40
                    }]
                }]
            });
            chart.render();
        };
    </script>
</body>

</html>
