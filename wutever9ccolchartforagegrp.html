<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Column Chart for Age Groups</title>
    <script src="https://cdn.canvasjs.com/canvasjs.min.js"></script>
</head>

<body>
    <div id="chartContainer" style="height: 300px; width: 400px;"></div>
    <script>
        window.onload = function() {
            const chart = new CanvasJS.Chart("chartContainer", {
                title: {
                    text: "Age Group Data"
                },
                axisX: {
                    title: "Age Groups"
                },
                axisY: {
                    title: "Population"
                },
                data: [{
                    type: "column",
                    dataPoints: [{
                        label: "0-18",
                        y: 50
                    }, {
                        label: "19-35",
                        y: 70
                    }, {
                        label: "36-50",
                        y: 45
                    }, {
                        label: "51+",
                        y: 30
                    }]
                }]
            });
            chart.render();
        };
    </script>
</body>

</html>
