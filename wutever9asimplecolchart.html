<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Simple Column Chart</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>

<body>
    <h3>Simple Column Chart</h3>
    <svg width="400" height="300"></svg>

    <script>
        const data = [{
            name: "A",
            value: 30
        }, {
            name: "B",
            value: 80
        }, {
            name: "C",
            value: 45
        }];

        const svg = d3.select("svg"),
            margin = 40,
            width = +svg.attr("width") - margin * 2,
            height = +svg.attr("height") - margin * 2;

        const x = d3.scaleBand().domain(data.map(d => d.name)).range([0, width]).padding(0.4);
        const y = d3.scaleLinear().domain([0, 100]).range([height, 0]);

        const g = svg.append("g").attr("transform", `translate(${margin},${margin})`);

        // X Axis
        g.append("g").attr("transform", `translate(0,${height})`).call(d3.axisBottom(x));
        // Y Axis
        g.append("g").call(d3.axisLeft(y));

        g.selectAll(".bar")
            .data(data)
            .enter().append("rect")
            .attr("x", d => x(d.name))
            .attr("y", d => y(d.value))
            .attr("width", x.bandwidth())
            .attr("height", d => height - y(d.value))
            .attr("fill", "blue");

        // Labels
        g.append("text").attr("x", width / 2).attr("y", height + 30).attr("text-anchor", "middle").text("Categories");
        g.append("text").attr("x", -height / 2).attr("y", -30).attr("transform", "rotate(-90)").attr("text-anchor", "middle").text("Values");
    </script>
</body>

</html>
