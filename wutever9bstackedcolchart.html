<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Stacked Column Chart with Legend</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>

<body>
    <svg width="500" height="350"></svg>

    <script>
        const data = [{
            group: "A",
            category1: 30,
            category2: 20
        }, {
            group: "B",
            category1: 50,
            category2: 30
        }];
        const categories = ["category1", "category2"];
        const colors = {
            category1: "blue",
            category2: "orange"
        };

        const svg = d3.select("svg"),
            margin = 50,
            width = +svg.attr("width") - margin * 2,
            height = +svg.attr("height") - margin * 2;

        const x = d3.scaleBand().domain(data.map(d => d.group)).range([0, width]).padding(0.4);
        const y = d3.scaleLinear().domain([0, 100]).range([height, 0]);

        const g = svg.append("g").attr("transform", `translate(${margin},${margin})`);

        // X Axis
        g.append("g").attr("transform", `translate(0,${height})`).call(d3.axisBottom(x));
        // Y Axis
        g.append("g").call(d3.axisLeft(y));

        // Stacked Bars
        data.forEach(d => {
            let start = 0;
            categories.forEach(key => {
                g.append("rect")
                    .attr("x", x(d.group))
                    .attr("y", y(start + d[key]))
                    .attr("width", x.bandwidth())
                    .attr("height", y(start) - y(start + d[key]))
                    .attr("fill", colors[key]);
                start += d[key];
            });
        });

        // Labels
        g.append("text").attr("x", width / 2).attr("y", height + 30).attr("text-anchor", "middle").text("Groups");
        g.append("text").attr("x", -height / 2).attr("y", -40).attr("transform", "rotate(-90)").attr("text-anchor", "middle").text("Values");

        // Legend
        const legend = svg.append("g").attr("transform", `translate(${width - 60}, 20)`);
        categories.forEach((key, i) => {
            legend.append("rect")
                .attr("x", 0)
                .attr("y", i * 20)
                .attr("width", 15)
                .attr("height", 15)
                .attr("fill", colors[key]);

            legend.append("text")
                .attr("x", 20)
                .attr("y", i * 20 + 12)
                .text(key)
                .attr("font-size", "12px");
        });
    </script>
</body>

</html>
