<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Single Line Chart</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>

<body>
    <svg width="500" height="300"></svg>

    <script>
        const data = [{
            x: 0,
            y: 10
        }, {
            x: 1,
            y: 30
        }, {
            x: 2,
            y: 20
        }, {
            x: 3,
            y: 50
        }];

        const svg = d3.select("svg"),
            margin = 50,
            width = +svg.attr("width") - margin * 2,
            height = +svg.attr("height") - margin * 2;

        const x = d3.scaleLinear().domain([0, 3]).range([0, width]);
        const y = d3.scaleLinear().domain([0, 50]).range([height, 0]);

        const g = svg.append("g").attr("transform", `translate(${margin},${margin})`);

        // Axes
        g.append("g").attr("transform", `translate(0,${height})`).call(d3.axisBottom(x));
        g.append("g").call(d3.axisLeft(y));

        const line = d3.line().x(d => x(d.x)).y(d => y(d.y));
        g.append("path").datum(data).attr("fill", "none").attr("stroke", "blue").attr("stroke-width", 2).attr("d", line);
    </script>
</body>

</html>
