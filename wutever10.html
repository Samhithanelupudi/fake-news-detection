<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colorful Charts with Canvas.js</title>
    <script src="https://cdn.canvasjs.com/canvasjs.min.js"></script>
</head>

<body>
    <h2>Line Chart</h2>
    <div id="lineChart" style="height: 300px; width: 80%;"></div>
    <h2>Pie Chart</h2>
    <div id="pieChart" style="height: 300px; width: 80%;"></div>
    <h2>Bar Chart</h2>
    <div id="barChart" style="height: 300px; width: 80%;"></div>
    <script>
        const data = [{
            age: "0-18",
            diabetes: 30
        }, {
            age: "19-35",
            diabetes: 50
        }, {
            age: "36-50",
            diabetes: 70
        }, {
            age: "51+",
            diabetes: 90
        }];
        const colors = ["tomato", "skyblue", "limegreen", "violet"];
        new CanvasJS.Chart("lineChart", {
            data: [{
                type: "line",
                color: "skyblue",
                dataPoints: data.map(d => ({
                    label: d.age,
                    y: d.diabetes
                }))
            }]
        }).render();
        new CanvasJS.Chart("pieChart", {
            data: [{
                type: "pie",
                dataPoints: data.map((d, i) => ({
                    label: d.age,
                    y: d.diabetes,
                    color: colors[i]
                }))
            }]
        }).render();
        new CanvasJS.Chart("barChart", {
            data: [{
                type: "bar",
                dataPoints: data.map((d, i) => ({
                    label: d.age,
                    y: d.diabetes,
                    color: colors[i]
                }))
            }]
        }).render();
    </script>
</body>

</html>
